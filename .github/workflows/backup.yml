name: Weekly Airtable backup

on:
  # Every Sunday at about 3 a.m. Central.
  schedule:
    - cron: "43 8 * * 0"
  # Adds a "Run workflow" button on the Actions tab for backing up on demand.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Back up Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python backup.py

      - name: Save to repository
        run: |
          git config user.name "Airtable backup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup
          if git diff --cached --quiet; then
            echo "No changes since the last backup."
          else
            git commit -m "Airtable backup $(date -u +%Y-%m-%d)"
            git push
          fi
