name: Keep Supabase awake

# Supabase pauses free projects that show low database activity over 7 days.
# Its docs say "a few user requests to the database each day" is typically enough,
# so this runs twice a day and makes several real database requests each time:
# the public.keepalive function (returns the time), called five times.
on:
  schedule:
    - cron: "17 13 * * *"   # daily, about 7:17 a.m. Central
    - cron: "41 1 * * *"    # daily, about 7:41 p.m. Central
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Public values (the same ones the website uses); access is enforced by the database.
      SUPABASE_URL: https://dxyfxmacwdbbkeirvsdx.supabase.co
      SUPABASE_KEY: sb_publishable_PHMTnFf2AOIbVbFGTcBuRw_eFY2WLu4
    steps:
      - name: Ping the database
        run: |
          call() {
            curl -s -o response.txt -w "%{http_code}" "$@" \
              -H "apikey: $SUPABASE_KEY"
          }
          ok=0
          for attempt in 1 2 3; do
            code=$(call -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" -H "Content-Type: application/json" -d '{}')
            echo "keepalive attempt $attempt: HTTP $code $(cat response.txt)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 30
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Supabase did not answer. If the project is paused, open the Supabase dashboard and click Restore."
            exit 1
          fi
          # A few more database requests so the activity counts as regular use.
          for i in 1 2 3 4; do
            sleep 5
            code=$(call -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" -H "Content-Type: application/json" -d '{}')
            echo "keepalive extra $i: HTTP $code"
          done
