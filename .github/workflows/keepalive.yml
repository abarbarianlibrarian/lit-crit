name: Keep Supabase awake

# Supabase pauses free projects after about a week with no database activity.
# This calls a tiny database function (public.keepalive, which just returns the time)
# every Monday and Thursday so student sign-in keeps working through quiet stretches like summer.
on:
  schedule:
    - cron: "23 15 * * 1,4"   # Mondays and Thursdays, about 9:23 a.m. Central
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Public values (the same ones the website uses); access is enforced by the database.
      SUPABASE_URL: https://dxyfxmacwdbbkeirvsdx.supabase.co
      SUPABASE_KEY: sb_publishable_PHMTnFf2AOIbVbFGTcBuRw_eFY2WLu4
    steps:
      - name: Ping the database
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o response.txt -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
            echo "Attempt $attempt: HTTP $code $(cat response.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::Supabase did not answer. If the project is paused, open the Supabase dashboard and click Restore."
          exit 1
