name: Build site from Airtable

on:
  # Rebuild every morning (about 4 a.m. Central) to pick up Airtable changes.
  schedule:
    - cron: "17 9 * * *"
  # Adds a "Run workflow" button on the Actions tab for rebuilding on demand.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      # Keeps downloaded images between builds so only new ones are fetched.
      - uses: actions/cache@v4
        with:
          path: .media-cache
          key: media-${{ github.run_id }}
          restore-keys: media-

      - name: Build
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          SITE_TITLE: ${{ vars.SITE_TITLE || 'Literary Criticism' }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
